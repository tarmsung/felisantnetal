# The database is a hosted Supabase project — there is intentionally no
# Postgres service here. This compose file runs everything else, on a
# VPS or any Docker host, with secrets supplied at deploy time, never
# baked into an image.
#
# Usage (see README "Deploying to a VPS" for the full walkthrough):
#   1. cp .env.example .env.local   and fill it in
#   2. docker compose --env-file .env.local up -d --build
#
# --env-file matters: compose reads ".env" by default, NOT ".env.local",
# so without it the ${...} values below come out empty.
#
# Nothing is published to the internet by this file itself:
#   - the app listens on 127.0.0.1:${APP_PORT:-3010} only (the host's
#     loopback), for a reverse proxy already on the server (e.g. nginx +
#     certbot) to forward to;
#   - whatsapp-service is reachable solely over the internal compose
#     network — it can send WhatsApp messages as the clinic and should
#     never be exposed directly (its API key is a second line of
#     defense, not the first);
#   - Caddy (below) is OPT-IN, for a fresh server with nothing else on
#     ports 80/443:  docker compose --profile caddy --env-file .env.local up -d --build
#
# whatsapp-service (Phase 5): read whatsapp-service/README.md — in
# particular its ban-risk disclosure — before pairing a real clinic
# WhatsApp number to it.

services:
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates + ACME account — persisted so a restart
      # doesn't re-request them (Let's Encrypt rate-limits that).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env.local}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in .env.local}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set in .env.local}
    env_file:
      - .env.local
    environment:
      # Overrides .env.local's http://localhost:3100 — inside this
      # container "localhost" is the app itself, not the other service.
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3100
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    restart: unless-stopped

  whatsapp-service:
    build:
      context: ./whatsapp-service
    environment:
      API_KEY: ${WHATSAPP_SERVICE_API_KEY:?set in .env.local}
    volumes:
      # Session credentials (see whatsapp-service/src/baileys.ts) —
      # named volume so re-pairing isn't needed on every restart.
      - whatsapp-auth:/app/auth_info
    expose:
      - "3100"
    restart: unless-stopped

volumes:
  whatsapp-auth:
  caddy-data:
  caddy-config:
